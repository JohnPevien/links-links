    { t: "隐藏相册", h: "/categories/4602731" },
    { t: "Uncategorized album", h: "/categories/0" }
  ]}
];

function render() {
  const container = document.getElementById('cats');
  container.innerHTML = data.map((cat, i) => `
    <div class="cat-card bg-dark-800 rounded-xl border border-dark-600 overflow-hidden" data-name="${cat.name.toLowerCase()}">
      <button class="cat-hdr w-full px-5 py-4 flex items-center justify-between hover:bg-dark-700 transition-colors" onclick="toggle(${i})">
        <span class="font-medium text-white">${cat.name}</span>
        <svg class="chev chev-${i} open h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div class="cat-content cnt-${i} open px-5 pb-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2 pt-2">
          ${cat.links.map(l => `<a href="${BASE_URL}${l.h}" target="_blank" class="block py-2 px-3 rounded-lg hover:bg-dark-600 text-gray-400 hover:text-blue-400 transition-all text-sm truncate">${l.t}</a>`).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function toggle(i) {
  document.querySelector(`.cnt-${i}`).classList.toggle('open');
  document.querySelector(`.chev-${i}`).classList.toggle('open');
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.cat-card').forEach(card => {
    const hasMatch = card.dataset.name.includes(q) || 
      Array.from(card.querySelectorAll('a')).some(a => a.textContent.toLowerCase().includes(q));
    card.style.display = hasMatch ? 'block' : 'none';
  });
});

render();
</script>
</body>
</html>
